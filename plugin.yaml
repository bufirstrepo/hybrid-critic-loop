manifest_version: 2
api_version: 1
name: the-millionaire-matrix
version: "0.4.0"
description: "The Millionaire Matrix (package: Hybrid Critic Loop) — every model family you have a seat for generates, all of them blind-score each other on a validity matrix anchored by real tests, and verified lessons carry into your next session."
author: "Dino Silvestri"
license: MIT
kind: standalone
requires_hermes: ">=0.21.0"
provides_tools:
  - critic_run
  - critic_matrix
  - critic_lessons
  - critic_ledger
  - critic_gate
provides_hooks:
  - pre_tool_call
  - on_session_start
  - pre_llm_call
emits:
  - run.progress
# python_dependencies: stdlib only — the plugin builds on the Hermes ctx
# surface plus the Python standard library, so there is nothing to install.
python_dependencies: []
tags:
  - critic
  - code-review
  - multi-model
  - lessons
