[build-system]
requires = ["setuptools>=68.0,<81.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-critic-loop"
version = "0.3.0"
description = "The Millionaire Matrix (package: Hybrid Critic Loop) - a Hermes plugin that makes every model family you have a seat for compete on testable contracts, blind-scored by their peers, and carries verified lessons back to your agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dino Silvestri" }]
requires-python = ">=3.11,<3.15"
# The plugin core uses only the Python standard library at runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
hcl = "hybrid_critic_loop.cli:main"

[tool.setuptools]
packages = ["hybrid_critic_loop"]
